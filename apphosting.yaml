# Firebase App Hosting settings for D365 Licence Check: PRODUCTION.
#
# The testing backend uses these too, with the changes in apphosting.testing.yaml on top
# (its App Hosting "Environment name" is set to "testing" in the Firebase console).
# Replace every <...> value. Secrets are created in the Firebase console (see README).

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

scripts:
  runCommand: node server/index.js

env:
  # The production address, exactly as people open it (no slash at the end). Goes into every email link.
  - variable: APP_URL
    value: https://d365--excel-292de.us-east4.hosted.app
    availability: [RUNTIME]

  # Dashboard sign-in: email + password accounts made in Firebase console > Authentication > Users.
  - variable: SIGN_IN
    value: firebase
    availability: [RUNTIME]
  # Firebase console > Project settings (gear) > General > "Web API key".
  - variable: FIREBASE_API_KEY
    value: AIzaSyDptS_naDVWNxz4wxaGAPYD-v-tB_CWNxY
    availability: [RUNTIME]
  # Keeps people signed in for 8 hours. Secret: any random text of 32+ characters.
  - variable: f28a7a77ef1f457e9c1c8c2ccf18b69317c367acc1bcff3dd854c8de0d162a25
    secret: sessionSecret

  # Who can use the dashboard (comma-separated). Each needs a Firebase Authentication account
  # with the same email.
  - variable: ROLE_ITDIRECTOR
    value: andres.santana@championchair.com
    availability: [RUNTIME]
  - variable: ROLE_ITADMIN
    value: jennifer.derby@championchair.com
    availability: [RUNTIME]
  # Read-only leadership access: add a ROLE_LEADERSHIP entry here (comma-separated emails) when needed.
  # Gets the "ready for IT Director approval" emails.
  - variable: IT_DIRECTOR_EMAIL
    value: andres.santana@championchair.com
    availability: [RUNTIME]

  # People loaded into Firestore (anyone not there yet is added on each start).
  - variable: ROSTER_FILE
    value: data/roster.json
    availability: [RUNTIME]

  # Email.
  #   outbox: invites wait on the dashboard under "Emails waiting to send" for IT to send.
  #   gmail:  sent automatically from MAIL_SENDER with a Google App Password (secret gmailAppPassword).
  - variable: MAIL_MODE
    value: outbox
    availability: [RUNTIME]
  - variable: MAIL_SENDER
    value: akeetek01@gmail.com
    availability: [RUNTIME]
  - variable: MAIL_FROM_NAME
    value: D365 Licence Check
    availability: [RUNTIME]
  # For MAIL_MODE gmail: create the gmailAppPassword secret, then delete just the # on the next two lines.
  - variable: GMAIL_APP_PASSWORD
    secret: gmailAppPassword

  # How long personal links work, in days.
  - variable: LINK_DAYS
    value: "30"
    availability: [RUNTIME]
