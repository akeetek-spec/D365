# Firebase App Hosting settings for D365 Licence Check: TESTING.
#
# Used only by the testing backend (Firebase console > App Hosting > testing backend > Settings >
# Environment > Environment name: testing). Everything not listed here comes from apphosting.yaml.
#
# What's different from production:
#   - its own Firestore database "test", so the real data is never touched
#   - only the test people listed in data/roster.test.json
#   - test sign-in: pick who to be, no password (allowed only because the database is "test")

runConfig:
  maxInstances: 1

env:
  # The testing backend's own address.
  - variable: APP_URL
    value: https://d365--excel-292de.us-east4.hosted.app
    availability: [RUNTIME]

  # Separate database. Create it first: Firebase console > Firestore Database > Create database, ID "test".
  - variable: FIRESTORE_DATABASE
    value: test
    availability: [RUNTIME]

  # Test sign-in with no password. To test the real email + password sign-in instead, change
  # SIGN_IN to firebase and add Firebase Authentication accounts for the two test emails.
  - variable: SIGN_IN
    value: password
    availability: [RUNTIME]
  - variable: ADMIN_LOGINS
    value: '[{"email":"andres.santana@championchair.com","password":"andres@123"},{"email":"pal@akeetek.com","password":"pal@123"}]'
    availability: [RUNTIME]
  # Firebase console > Project settings (gear) > General > "Web API key".
  - variable: FIREBASE_API_KEY
    value: AIzaSyDptS_naDVWNxz4wxaGAPYD-v-tB_CWNxY
    availability: [RUNTIME]
  - variable: ALLOW_TEST_SIGNIN
    value: "true"
    availability: [RUNTIME]

  # Only test emails, so nothing reaches Champion Chair.
  - variable: ROLE_ITDIRECTOR
    value: pal@akeetek.com
    availability: [RUNTIME]
  - variable: ROLE_ITADMIN
    value: akeetek01@gmail.com,andres.santana@championchair.com
    availability: [RUNTIME]
  - variable: IT_DIRECTOR_EMAIL
    value: pal@akeetek.com
    availability: [RUNTIME]
  - variable: ROSTER_FILE
    value: data/roster.test.json
    availability: [RUNTIME]

  # Email: sent automatically from Microsoft 365.
  - variable: MAIL_MODE
    value: smtp
    availability: [RUNTIME]
  - variable: MAIL_SENDER
    value: akeetek@championchair.com
    availability: [RUNTIME]
  - variable: MAIL_FROM_NAME
    value: D365 Licence Check
    availability: [RUNTIME]
  - variable: SMTP_PASSWORD
    value: "NumerousPuzzling432!"
    availability: [RUNTIME]
